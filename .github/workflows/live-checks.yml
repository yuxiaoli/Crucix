name: Live architecture checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, cloud-backend-probe]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Build fixture API configuration (not published)
        env:
          CRUCIX_API_BASE: https://example.invalid
          CRUCIX_SOURCE_URL: https://github.com/yuxiaoli/Crucix
        run: npm run pages:build
